[versions]
errorprone = '2.31.0'
jackson = '2.22.1'

[plugins]
errorprone = 'net.ltgt.errorprone:5.1.0'
jar = 'org.beryx.jar:2.0.0'
jmh = 'me.champeau.jmh:0.7.3'
pitest = 'info.solidsoft.pitest:1.19.0'
publish-plugin = 'io.github.gradle-nexus.publish-plugin:2.0.0'
release = 'net.researchgate.release:3.1.0'
spotless = 'com.diffplug.spotless:7.2.1'

[libraries]
assertj = 'org.assertj:assertj-core:3.27.7'
dom4j = 'org.dom4j:dom4j:2.2.0'
errorprone = { module = 'com.google.errorprone:error_prone_core', version.ref = 'errorprone' }
gson = 'com.google.code.gson:gson:2.14.0'
jackson-databind = { module = 'com.fasterxml.jackson.core:jackson-databind', version.ref = 'jackson' }
jackson-dataformat-yaml = { module = 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml', version.ref = 'jackson' }
jaxen = 'jaxen:jaxen:2.0.6'
jdom2 = 'org.jdom:jdom2:2.0.6.1'
json = 'org.json:json:20260814'
json-api = 'jakarta.json:jakarta.json-api:2.1.3'
json-impl = 'org.glassfish:jakarta.json:2.0.1'
junit-bom = 'org.junit:junit-bom:6.1.3'
mockito = 'org.mockito:mockito-junit-jupiter:5.23.0'
scala-xml = 'org.scala-lang.modules:scala-xml_%%:2.4.0'
scalatest-funspec = 'org.scalatest:scalatest-funspec_%%:3.2.20'
scalatest-junit-runner = 'org.scalatestplus:junit-5-14_%%:3.2.20.0'
wartremover = 'org.wartremover:wartremover_%%:3.5.7'
xom = 'xom:xom:1.4.6'

[bundles]
scalatest = ["scalatest-funspec", "scalatest-junit-runner"]
