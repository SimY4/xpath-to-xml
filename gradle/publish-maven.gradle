apply plugin: 'maven-publish'
apply plugin: 'signing'

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.find { it.name == 'java' || it.name == 'javaPlatform' }
            versionMapping {
                usage('java-api') {
                    fromResolutionResult()
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
            afterEvaluate { project ->
                pom {
                    name = project.name
                    description = project.description
                    url = 'http://github.com/SimY4/xpath-to-xml'
                    inceptionYear = '2017'

                    properties = [
                        'info.releaseNotesURL': 'https://github.com/SimY4/xpath-to-xml/releases',
                        'info.versionScheme': 'semver-spec'
                    ]

                    scm {
                        connection = 'scm:git:https://github.com/SimY4/xpath-to-xml'
                        developerConnection = 'scm:git:https://github.com/SimY4/xpath-to-xml'
                        url = 'http://github.com/SimY4/xpath-to-xml'
                    }

                    issueManagement {
                        system = 'GitHub'
                        url = 'https://github.com/SimY4/xpath-to-xml/issues'
                    }

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }

                    developers {
                        developer {
                            id = 'SimY4'
                            name = 'Alex Simkin'
                            url = 'http://github.com/SimY4'
                        }
                    }
                }
            }
        }
    }
}

def signingKey = System.getenv("GPG_SECRET_KEY")
def signingPassword = System.getenv("GPG_SECRET_KEY_PASSWORD")

signing {
    if (signingKey != null && signingPassword != null && !signingKey.isEmpty() && !signingPassword.isEmpty()) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    }
    sign publishing.publications.mavenJava
}
